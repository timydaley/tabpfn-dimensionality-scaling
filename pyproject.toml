[project]
name = "tabdim"
version = "0.1.0"
description = "Does tabular foundation model performance scale with feature dimensionality?"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "tabpfn",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
